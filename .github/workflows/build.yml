name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  security-gate:
    name: No-secrets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert private/ and auth files are absent from build context
        run: |
          set -e
          BAD=$(find . \( \
            -name "auth.json" \
            -o -name "*.asc" \
            -o -name "private_keys*" \
            -o -path "*/private/*" \
            -o -name ".secrets" \
            -o -name "*.env" \
          \) -not -path "./.git/*" 2>/dev/null || true)
          if [[ -n "$BAD" ]]; then
            echo "❌ Sensitive files found in build context:"
            echo "$BAD"
            exit 1
          fi
          echo "✓ No sensitive files found"

  build:
    name: Build (${{ matrix.platform }})
    needs: security-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  merge:
    name: Merge manifests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          TAGS="${{ env.IMAGE }}:sha-${SHA_SHORT}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${{ env.IMAGE }}:latest,${{ env.IMAGE }}:main"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${{ env.IMAGE }}:${TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /') \
            ${{ env.IMAGE }}:sha-${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:sha-${{ github.sha }}-arm64
