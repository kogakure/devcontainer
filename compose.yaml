# compose.yaml — for Zed / headless / docker-run attach flows
# VS Code and Cursor users: use "Reopen in Container" via devcontainer.json instead.
#
# Usage:
#   docker compose up -d          # start container
#   docker compose exec dev fish  # attach a shell
#   docker compose down           # stop + remove

services:
  dev:
    # image: ghcr.io/kogakure/devcontainer:latest  # use after CI publishes
    build: .
    container_name: floating-phoenix
    user: vscode
    working_dir: /workspaces
    stdin_open: true
    tty: true

    ports:
      - "2222:22"   # SSH — connect with: ssh -p 2222 vscode@localhost

    volumes:
      # Workspace — replace with your project path
      - ..:/workspaces:cached

      # ── Read-only credential mounts (no secrets in image) ────────────────
      - ${HOME}/.claude/.credentials.json:/home/vscode/.claude/.credentials.json:ro
      - ${HOME}/.claude/settings.json:/home/vscode/.claude/settings.json:ro
      - ${HOME}/.claude.json:/home/vscode/.claude.json:ro
      # Only auth.json :ro; config.toml must stay writable (codex writes trust settings)
      - ${HOME}/.codex/auth.json:/home/vscode/.codex/auth.json:ro
      - ${HOME}/.pi/agent/auth.json:/home/vscode/.pi/agent/auth.json:ro
      - ${HOME}/.grok:/home/vscode/.grok:ro
      - ${HOME}/.config/gh:/home/vscode/.config/gh:ro
      - ${HOME}/.config/git/config-personal:/home/vscode/.config/git/config-personal:ro
      - ${HOME}/.agents:/home/vscode/.agents:ro
      # SSH public keys for container access (create with: cat ~/.ssh/id_ed25519.pub > ~/.ssh/authorized_keys)
      - ${HOME}/.ssh/authorized_keys:/home/vscode/.ssh/authorized_keys:ro

    environment:
      # Forward SSH agent (Secretive on macOS works via this)
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:-}
      # Passthrough API keys if you prefer env-var injection over file mounts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

    # SSH agent socket forwarding (macOS host)
    # volumes entry for the socket, needed if SSH_AUTH_SOCK is a file path
    # Uncomment and adjust if Secretive/SSH-agent uses a socket file:
    # - ${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}:ro

    # CMD from image: entrypoint.sh starts sshd then execs fish
